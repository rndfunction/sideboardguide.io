<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sideboard Guide Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23c8804a' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'%3E%3Crect x='6' y='3' width='20' height='26' rx='2' transform='rotate(-3 16 16)'/%3E%3Ccircle cx='16' cy='12' r='2.4'/%3E%3Cpath d='M9 24 L16 15 L23 24 Z' opacity='0.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/@trussworks/react-uswds@3.0.0/lib/css/styles.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <div class="app-shell">
    <main class="grid-container">
      <header class="site-header">
        <div class="site-header-main">
          <h1>
            <a href="./" class="site-title-link" title="Start fresh">
              <span class="site-logo" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
                  <!-- Back card -->
                  <rect x="6" y="3" width="20" height="26" rx="2" transform="rotate(-8 16 16)" opacity="0.4"></rect>
                  <!-- Middle card -->
                  <rect x="6" y="3" width="20" height="26" rx="2" transform="rotate(-3 16 16)" opacity="0.7"></rect>
                  <!-- Front card -->
                  <rect x="6" y="3" width="20" height="26" rx="2"></rect>
                  <!-- Simple mark on front card -->
                  <circle cx="16" cy="12" r="2.4"></circle>
                  <path d="M9 24 L16 15 L23 24 Z" opacity="0.85"></path>
                </svg>
              </span>
              <span class="site-title-text">Sideboard Guide Builder</span>
            </a>
          </h1>
          <nav class="site-mode-nav" aria-label="App mode">
            <button
              type="button"
              class="site-mode-btn"
              :class="{ 'is-active': mode === 'build' }"
              @click="setMode('build')"
            >Build</button>
            <button
              type="button"
              class="site-mode-btn"
              :class="{ 'is-active': mode === 'browse' }"
              @click="setMode('browse')"
            >Browse</button>
          </nav>
        </div>
        <p class="usa-intro">Paste a decklist. Build a sideboard guide. Print sleeve-sized cards for the deckbox.</p>
      </header>

      <!-- Browse mode replaces the workspace with the community guide library -->
      <guide-library
        v-if="mode === 'browse'"
        @load-share="onLoadSharedGuide"
        @submit-guide="onSubmitGuide"
      ></guide-library>

      <div v-if="mode === 'build'" class="app-two-col" :class="{ 'app-two-col-loaded': enriched }">
        <!-- ============================================================
             Left column: the workspace. Input, buttons, and the grid
             all stack here, top to bottom.
             ============================================================ -->
        <section class="workspace">
          <deck-input
            :parsed="parsed"
            :loading="loading"
            :error="error"
            @parse="onParse"
            @reset="onReset"
          ></deck-input>

      <guide-toolbar
        v-if="enriched"
        :deck-name="deckName"
        :raw-text="store.rawText"
        :matchups="matchups"
        :plan="plan"
        :print-open="showPrint"
        :format="selectedFormat"
        @load-state="onLoadState"
        @add-matchups="onAddMatchups"
        @toggle-print="onTogglePrint"
        @import-share="onImportShare"
        @browse-guides="onOpenGuideBrowser"
        @submit-guide="onSubmitGuide"
      ></guide-toolbar>

      <deck-grid
        v-if="mode === 'build' && enriched"
        :deck="enriched"
            :matchups="matchups"
            :plan="plan"
            :deck-name="deckName"
            @add-matchup="addMatchup"
            @rename-matchup="onRenameMatchup"
            @remove-matchup="removeMatchup"
            @toggle-card="onToggleCard"
            @set-card-plan="onSetCardPlan"
            @update:deck-name="onDeckNameChange"
          ></deck-grid>
        </section>

        <!-- ============================================================
             Right column: card preview pane. Sample cards when empty,
             live print preview when a deck is loaded.
             ============================================================ -->
        <aside class="preview-pane">
          <div class="preview-pane-body">
            <sample-cards v-if="!enriched"></sample-cards>

            <print-view
              v-if="enriched && showPrint"
              :deck="enriched"
              :deck-name="deckName"
              :format="selectedFormat"
              :matchups="matchups"
              :plan="plan"
              @close="onClosePrint"
            ></print-view>

            <div v-if="enriched && !showPrint" class="preview-pane-off">
              <p>Preview hidden.</p>
              <button
                type="button"
                class="usa-button"
                @click="onTogglePrint"
              >Show print preview</button>
            </div>
          </div>
        </aside>
      </div>

      <footer class="usa-footer__primary-section" v-if="!parsed">
        <p>No data leaves your browser except card lookups to Scryfall.</p>
      </footer>

      <div v-if="submitStatus" class="submit-status-bar" :class="submitStatusClass">
        {{ submitStatus }}
      </div>
    </main>
  </div>

  <div class="print-root">
    <print-view
      v-if="enriched && showPrint"
      :deck="enriched"
      :deck-name="deckName"
      :format="selectedFormat"
      :matchups="matchups"
      :plan="plan"
      :print-mode="true"
      @close="onClosePrint"
    ></print-view>
  </div>

  <!-- Global card image hover preview -->
  <card-preview></card-preview>

  <!-- Community guides browser (modal) -->
  <guide-browser
    :open="showGuideBrowser"
    @close="onCloseGuideBrowser"
    @load-share="onLoadSharedGuide"
  ></guide-browser>

  <!-- GitHub device-flow auth dialog (shown when submitting) -->
  <device-auth-dialog
    :open="showAuthDialog"
    @authorized="onAuthAuthorized"
    @close="onAuthClose"
  ></device-auth-dialog>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
